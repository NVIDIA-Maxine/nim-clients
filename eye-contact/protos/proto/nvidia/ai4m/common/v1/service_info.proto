syntax = "proto3";

package nvidia.ai4m.common.v1;

// One-shot provenance banner identifying the NIM that produced this
// response stream and the specific request being served.
message ServiceInfo {
  // Human-readable feature version, e.g. "x.y.z".
  string feature_version = 1;

  // Human-readable feature name, e.g. "<xyz>".
  string feature_name = 2;

  // Identity of the model used for the service.
  string model_info = 3;

  // Server-assigned request identifier. Used to
  // locate the server logs for the request.
  string server_request_id = 4;

  // Client-assigned session identifier. Used to
  // locate the session logs for the request.
  string client_session_id = 5;
}
